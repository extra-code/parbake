# OCX project toolchain — managed by `ocx add` / `ocx remove`.
# Swift, codesign and swift-format come from Xcode; OCX carries everything else.
# Taskfile.yml runs group tools through `ocx exec -g <group>`.

# task is the entry point, so it lands on PATH eagerly.
[tools]
task = "ocx.sh/go-task/task:3.53.1"

# Groups download on first use, so a fresh checkout pulls only task.
[group.lint]
lazy-mode = "always"

[group.lint.tools]
shellcheck = "ocx.sh/shellcheck/shellcheck:0.11.0"
shfmt = "ocx.sh/shfmt/shfmt:3.14.1"
uv = "ocx.sh/astral-sh/uv:0.13.5"

[group.release]
lazy-mode = "always"

[group.release.tools]
git-cliff = "ocx.sh/git-cliff/git-cliff:2.14.2"
