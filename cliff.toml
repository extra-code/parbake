# git-cliff configuration for the release notes (`task release:notes`).
# Every commit is listed as its subject followed by its body lines.

[changelog]
header = ""
body = """
{% if version %}## {{ version }}{% else %}## Unreleased{% endif %}
{% for commit in commits %}
{% set lines = commit.message | split(pat="\\n") %}\
- {{ lines | first | trim }}
{% for line in lines | slice(start=1) %}{% if line | trim | length > 0 %}\
{% set t = line | trim %}{{ "  " ~ t }}
{% endif %}{% endfor %}\
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = false
filter_unconventional = false
filter_commits = false
topo_order = false
sort_commits = "oldest"
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
commit_parsers = [
    { message = "^Merge", skip = true },
]
