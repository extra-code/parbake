# Swift, codesign and swift-format come from Xcode. Every other tool runs through
# `ocx exec`, which downloads it on first use (see ocx.toml).
version: "3"

vars:
  NAME: container-runtime-macos
  SWIFT: /usr/bin/swift
  CONFIGURATION: '{{.CONFIGURATION | default "debug"}}'
  # `-` signs ad hoc; any other value must name an identity that `security find-identity` lists.
  CODESIGN_IDENTITY: '{{.CODESIGN_IDENTITY | default "-"}}'
  # Signs `parbake` alone; defaults to CODESIGN_IDENTITY. The plugin and `parbake-agent` keep CODESIGN_IDENTITY.
  PARBAKE_CODESIGN_IDENTITY: '{{.PARBAKE_CODESIGN_IDENTITY | default .CODESIGN_IDENTITY}}'
  PARBAKE_CODESIGN_OPTS: '{{.PARBAKE_CODESIGN_OPTS | default (printf "--force --sign %q --timestamp=none" .PARBAKE_CODESIGN_IDENTITY)}}'
  CODESIGN_OPTS: '{{.CODESIGN_OPTS | default (printf "--force --sign %q --timestamp=none" .CODESIGN_IDENTITY)}}'
  # Root of the container installation; plugins load from <root>/libexec/container-plugins.
  INSTALL_ROOT: '{{.INSTALL_ROOT | default "/usr/local"}}'
  PLUGIN_DIR: "{{.INSTALL_ROOT}}/libexec/container-plugins/{{.NAME}}"
  # Naming the binding resolves only that tool, not the whole group.
  SHELLCHECK: ocx exec -g lint shellcheck -- shellcheck
  SHFMT: ocx exec -g lint shfmt -- shfmt -i 4 -ci
  REUSE: ocx exec -g lint uv -- uvx --from 'reuse[charset-normalizer]==6.2.0' reuse
  SHELL_FILES:
    sh: git ls-files '*.sh'

tasks:
  default:
    silent: true
    cmds:
      - task --list

  setup:
    desc: Render the OCX toolchain; group tools download on first use
    cmds:
      - ocx pull

  build:
    desc: Build all products (CONFIGURATION=debug|release)
    cmds:
      - "{{.SWIFT}} build -c {{.CONFIGURATION}}"

  sign:identity:
    internal: true
    silent: true
    cmds:
      - echo "signing with {{.CODESIGN_IDENTITY}}; parbake with {{.PARBAKE_CODESIGN_IDENTITY}}"
      - |
        for identity in "{{.CODESIGN_IDENTITY}}" "{{.PARBAKE_CODESIGN_IDENTITY}}"; do
          if [ "$identity" != "-" ] && ! security find-identity -v -p codesigning | grep -qF -- "\"$identity\""; then
            echo "error: signing identity \"$identity\" is not in the keychain; see docs/signing.md" >&2
            exit 1
          fi
        done

  sign:
    desc: Build and sign the binaries with their entitlements (CODESIGN_IDENTITY, default ad hoc; PARBAKE_CODESIGN_IDENTITY for parbake alone)
    vars:
      BIN_DIR:
        sh: "{{.SWIFT}} build -c {{.CONFIGURATION}} --show-bin-path"
    cmds:
      - task: sign:identity
      - task: build
      - codesign {{.CODESIGN_OPTS}} --entitlements={{.NAME}}.entitlements "{{.BIN_DIR}}/{{.NAME}}"
      - codesign {{.PARBAKE_CODESIGN_OPTS}} --entitlements={{.NAME}}.entitlements "{{.BIN_DIR}}/parbake"
      - codesign {{.CODESIGN_OPTS}} "{{.BIN_DIR}}/parbake-agent"

  bin-path:
    desc: Print the build output directory
    silent: true
    cmds:
      - "{{.SWIFT}} build -c {{.CONFIGURATION}} --show-bin-path"

  test:
    desc: Run the Swift tests
    cmds:
      - "{{.SWIFT}} test -c {{.CONFIGURATION}}"

  coverage:
    desc: Run the tests with coverage and print line coverage per module
    cmds:
      - scripts/coverage.sh

  install:
    desc: Install the signed plugin into INSTALL_ROOT
    deps: [sign]
    vars:
      BIN_DIR:
        sh: "{{.SWIFT}} build -c {{.CONFIGURATION}} --show-bin-path"
    cmds:
      - mkdir -p "{{.PLUGIN_DIR}}/bin"
      - install -m 0755 "{{.BIN_DIR}}/{{.NAME}}" "{{.PLUGIN_DIR}}/bin/{{.NAME}}"
      - install -m 0755 "{{.BIN_DIR}}/parbake" "{{.PLUGIN_DIR}}/bin/parbake"
      - install -m 0755 "{{.BIN_DIR}}/parbake-agent" "{{.PLUGIN_DIR}}/bin/parbake-agent"
      - install -m 0644 config.toml "{{.PLUGIN_DIR}}/config.toml"
      - echo "installed {{.NAME}} to {{.PLUGIN_DIR}}"

  uninstall:
    desc: Remove the installed plugin
    cmds:
      - rm -rf "{{.PLUGIN_DIR}}"

  fmt:
    desc: Format Swift and shell sources
    cmds:
      - task: fmt:swift
      - task: fmt:sh

  fmt:swift:
    cmds:
      - "{{.SWIFT}} format --recursive --configuration .swift-format -i Sources Tests Package.swift"

  fmt:sh:
    cmds:
      - "{{.SHFMT}} -w {{.SHELL_FILES | catLines}}"

  lint:
    desc: Check Swift and shell formatting, lint shell scripts, check licence headers
    cmds:
      - task: lint:swift
      - task: lint:sh
      - task: lint:reuse
      - task: lint:boundaries
      - task: lint:release
      - task: lint:e2e
      - task: lint:coverage

  lint:reuse:
    cmds:
      - "{{.REUSE}} lint"

  lint:swift:
    cmds:
      - "{{.SWIFT}} format lint --recursive --configuration .swift-format Sources Tests Package.swift"

  lint:sh:
    cmds:
      - "{{.SHELLCHECK}} {{.SHELL_FILES | catLines}}"
      - "{{.SHFMT}} -d {{.SHELL_FILES | catLines}}"

  lint:boundaries:
    cmds:
      - scripts/lint-boundaries.sh --self-test
      - scripts/lint-boundaries.sh

  lint:release:
    cmds:
      - scripts/release.sh --self-test
      - scripts/package.sh --self-test

  lint:e2e:
    cmds:
      - scripts/package-e2e.sh --self-test

  lint:coverage:
    cmds:
      - scripts/coverage.sh --self-test

  release:build:
    desc: >-
      Build, sign and verify a tagged release in a sibling worktree: task release:build VERSION=X.Y.Z.
      Needs vX.Y.Z or HEAD on main; CODESIGN_IDENTITY and PARBAKE_CODESIGN_IDENTITY pass through;
      RELEASE_ALLOW_NON_MAIN=1 skips the main check for a local dry run. Binaries land in .build/release-assets/X.Y.Z/
    preconditions:
      - sh: test -n "{{.VERSION}}"
        msg: "VERSION is required: task release:build VERSION=X.Y.Z"
    env:
      CODESIGN_IDENTITY: "{{.CODESIGN_IDENTITY}}"
      PARBAKE_CODESIGN_IDENTITY: "{{.PARBAKE_CODESIGN_IDENTITY}}"
    cmds:
      - scripts/release.sh build "{{.VERSION}}"

  package:
    desc: >-
      Build the OCX package of the Parbake plugin: task package VERSION=X.Y.Z.
      Runs release:build first (same signing variables; RELEASE_ALLOW_NON_MAIN=1 skips the main check
      for a local dry run), then scripts/package.sh all. PACKAGE_PAIR_LOCATION may point the pairing check at a fork clone
      for a dry run before the fork tag exists. The archive lands in .build/package/
    requires:
      vars: [VERSION]
    preconditions:
      - sh: test -n "{{.VERSION}}"
        msg: "VERSION is required: task package VERSION=X.Y.Z"
    cmds:
      - task: release:build
        vars:
          VERSION: "{{.VERSION}}"
      - scripts/package.sh all "{{.VERSION}}"

  e2e:package:
    desc: Run the package end-to-end run against the published packages (attended)
    interactive: true
    cmds:
      - scripts/package-e2e.sh run

  e2e:package:candidate:
    desc: "Run the package end-to-end run against a locally built candidate: task e2e:package:candidate VERSION=X.Y.Z (attended)"
    interactive: true
    requires:
      vars: [VERSION]
    env:
      PKG_E2E_VERSION: "{{.VERSION}}"
    cmds:
      - |
        if ! printf '%s\n' "$PKG_E2E_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
          echo "VERSION must be X.Y.Z, got \"$PKG_E2E_VERSION\"" >&2
          exit 2
        fi
        if [ ! -f ".build/package/parbake-$PKG_E2E_VERSION.tar.xz" ]; then
          "{{.TASK_EXE}}" package VERSION="$PKG_E2E_VERSION"
        fi
      - scripts/package-e2e.sh run --candidate "$PKG_E2E_VERSION"

  release:notes:
    desc: >-
      Write .build/release-assets/changelog.md with git-cliff: the release of the latest vX.Y.Z tag
      (the tag at HEAD in CI); with no tag, every commit under Unreleased
    cmds:
      - mkdir -p .build/release-assets
      - ocx exec -g release -- git-cliff --config cliff.toml --latest --output .build/release-assets/changelog.md

  check:
    desc: Lint, build, sign and test — the full local gate
    cmds:
      - task: lint
      - task: sign
      - task: test

  clean:
    desc: Remove build artifacts
    cmds:
      - "{{.SWIFT}} package clean"
